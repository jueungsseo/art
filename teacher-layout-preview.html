<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Layout Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 221, 230, 0.8), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(210, 237, 255, 0.85), transparent 32%),
        radial-gradient(circle at 50% 90%, rgba(221, 255, 232, 0.75), transparent 34%),
        linear-gradient(135deg, #fff7fb 0%, #f7fbff 48%, #fffaf1 100%);
      color: #3f3a4a;
    }

    .soft-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 60px rgba(123, 103, 156, 0.16);
    }

    .teacher-stage {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 78%, rgba(255, 216, 233, 0.8), transparent 20%),
        linear-gradient(135deg, rgba(255, 248, 217, 0.9), rgba(255, 242, 250, 0.74));
    }

    .teacher-cutout {
      position: absolute;
      left: 18px;
      bottom: -10px;
      width: min(34vw, 230px);
      min-width: 150px;
      filter: drop-shadow(0 18px 24px rgba(93, 78, 122, 0.18));
      z-index: 2;
    }

    .teacher-speech {
      position: relative;
      z-index: 3;
      margin-left: min(31vw, 220px);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 34px rgba(117, 92, 145, 0.12);
    }

    .teacher-speech::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 42px;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.92);
      transform: rotate(45deg);
    }

    @media (max-width: 640px) {
      .teacher-stage {
        padding-top: 190px;
      }

      .teacher-cutout {
        left: 50%;
        bottom: auto;
        top: 10px;
        width: 180px;
        transform: translateX(-50%);
      }

      .teacher-speech {
        margin-left: 0;
      }

      .teacher-speech::before {
        left: 50%;
        top: -10px;
        transform: translateX(-50%) rotate(45deg);
      }
    }
  </style>
</head>
<body>
  <main class="min-h-screen px-4 py-6 sm:px-6 flex items-center justify-center">
    <section class="w-full max-w-3xl">
      <div class="soft-card rounded-[28px] p-6 sm:p-9">
        <div class="mb-6 flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-bold text-[#8f7acb]">미술심리 알아보기</p>
            <h2 class="mt-1 text-2xl sm:text-3xl font-extrabold text-[#4b3f72]">O/X 퀴즈</h2>
          </div>
          <div class="rounded-full bg-white/80 px-4 py-2 text-sm font-bold text-[#7c5fc7] shadow-sm">2 / 5</div>
        </div>

        <div class="mb-7 flex gap-2">
          <div class="h-3 w-3 rounded-full bg-white/80"></div>
          <div class="h-3 w-[34px] rounded-full bg-gradient-to-r from-[#f9a8d4] to-[#93c5fd]"></div>
          <div class="h-3 w-3 rounded-full bg-white/80"></div>
          <div class="h-3 w-3 rounded-full bg-white/80"></div>
          <div class="h-3 w-3 rounded-full bg-white/80"></div>
        </div>

        <div class="rounded-3xl bg-white/72 p-6 sm:p-8 shadow-sm">
          <p class="text-xl sm:text-2xl font-bold leading-9 text-[#40394f]">
            Q2. 미술심리치료사는 내 그림을 보고 '그림을 얼마나 잘 그렸는지' 예술 점수를 매기는 사람이다?
          </p>

          <div class="mt-8 grid grid-cols-2 gap-4">
            <button class="rounded-3xl border-2 border-transparent bg-[#ffe1eb] px-4 py-6 text-3xl font-extrabold text-[#d94b78]">O</button>
            <button class="rounded-3xl border-2 border-[#7c5fc7] bg-[#dff0ff] px-4 py-6 text-3xl font-extrabold text-[#3f7fc0]">X</button>
          </div>

          <div class="teacher-stage mt-6 min-h-[250px] rounded-3xl p-5 sm:min-h-[270px] sm:p-7">
            <img src="teacher.png" alt="미술심리치료사 선생님" class="teacher-cutout" />
            <div class="teacher-speech rounded-[26px] border border-white/90 p-5 sm:p-6">
              <p class="font-extrabold text-[#5b9c78]">정답이에요.</p>
              <p class="mt-3 text-base leading-8 text-[#62553a] sm:text-lg">
                미술심리치료사는 그림 실력을 평가하지 않아요. 작품 속에 담긴 감정과 이야기를 함께 바라보는 사람이에요.
              </p>
            </div>
          </div>

          <button class="mt-6 w-full rounded-full bg-[#7c5fc7] px-6 py-4 font-bold text-white shadow-lg shadow-purple-200">
            다음으로
          </button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
